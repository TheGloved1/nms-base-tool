[package]
name = "nms-base-tool"
version = "26.9.4"
description = "No Man's Sky save editor — Tauri + SvelteKit"
authors = ["TheGloved1"]
license = "MIT"
edition = "2021"

[lib]
name = "nms_base_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
zip = "4"
lz4_flex = "0.11"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
chrono = "0.4"

[profile.dev]
incremental = true

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
