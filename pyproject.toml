[project]
name = "nms-proton-gtk"
version = "0.1.0"
description = "Proton-native GTK GUI for No Man's Sky base extraction -> NMS Base Builder App (GTK4 + Proton)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lz4>=4.0.0",
    "PyGObject>=3.40",
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.scripts]
nms-proton-gtk = "nms_gtk.app:main"
nms-proton-tui = "nms_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nms_tui", "nms_gtk"]

[project.optional-dependencies]
textual = ["textual>=0.80.0", "rich>=13.0.0"]
